        // Genera le domande nel DOM
        function generaDomande() {
            const container = document.getElementById('questionsContainer');
            
            domande.forEach(sezione => {
                // Crea titolo sezione
                const titoloSezione = document.createElement('div');
                titoloSezione.className = 'section-title';
                titoloSezione.textContent = sezione.sezione;
                container.appendChild(titoloSezione);
                
                // Crea domande della sezione
                sezione.domande.forEach(domanda => {
                    const questionDiv = document.createElement('div');
                    questionDiv.className = 'question-container';
                    
                    const questionText = document.createElement('div');
                    questionText.className = 'question';
                    questionText.textContent = `${domanda.numero}. ${domanda.testo}`;
                    questionDiv.appendChild(questionText);
                    
                    const answersList = document.createElement('ul');
                    answersList.className = 'answers';
                    
                    domanda.risposte.forEach((risposta, index) => {
                        const li = document.createElement('li');
                        const input = document.createElement('input');
                        const label = document.createElement('label');
                        
                        input.type = 'radio';
                        input.name = `q${domanda.numero}`;
                        input.value = String.fromCharCode(97 + index); // a, b, c, d
                        input.id = `q${domanda.numero}_${String.fromCharCode(97 + index)}`;
                        
                        label.htmlFor = input.id;
                        label.textContent = risposta;
                        
                        li.appendChild(input);
                        li.appendChild(label);
                        answersList.appendChild(li);
                    });
                    
                    questionDiv.appendChild(answersList);
                    container.appendChild(questionDiv);
                });
            });
        }
        
        // Carica le domande quando la pagina è pronta
        document.addEventListener('DOMContentLoaded', generaDomande);
        
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Raccolta dati studente
            const studentData = {
                nome: document.getElementById('nome').value,
                cognome: document.getElementById('cognome').value,
                classe: document.getElementById('classe').value,
                dataTest: new Date().toLocaleString('it-IT'),
                risposte: {}
            };
            
            // Raccolta risposte
            for (let i = 1; i <= 60; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                studentData.risposte[`domanda_${i}`] = selected ? selected.value : '';
            }
            
            // Array completo delle risposte corrette per tutte le 60 domande 
            const risposteCorrette = [
                'b', 'd', 'c', 'd', 'a', 'd', 'b', 'd', 'a', 'c',  // 1-10: Concetti di Base ICT
                'd', 'd', 'd', 'c', 'c', 'a', 'b', 'a', 'c', 'a',  // 11-20: Gestione Files
                'b', 'c', 'a', 'a', 'c', 'b', 'd', 'a', 'a', 'c',  // 21-30: Elaborazione Testi 
                'a', 'a', 'c', 'b', 'd', 'a', 'c', 'a', 'c', 'b',  // 31-40: Fogli Elettronici
                'a', 'd', 'c', 'c', 'c', 'd', 'c', 'b', 'c', 'a',  // 41-50: Presentazioni 
                'c', 'd', 'd', 'd', 'c', 'a', 'a', 'd', 'b', 'a'   // 51-60: Navigazione e Comunicazione 
            ];
            let risposteCorrette_count = 0;
            let risposteErrate_count = 0;
            let risposteMancanti_count = 0;
            const dettaglioRisposte = {};
            
            for (let i = 1; i <= 60; i++) {
                const rispostaStudente = studentData.risposte[`domanda_${i}`];
                const rispostaCorretta = risposteCorrette[i-1];
                
                if (!rispostaStudente || rispostaStudente === '') {
                    risposteMancanti_count++;
                    dettaglioRisposte[`domanda_${i}_punti`] = 0;
                    dettaglioRisposte[`domanda_${i}_corretta`] = rispostaCorretta;
                } else if (rispostaStudente === rispostaCorretta) {
                    risposteCorrette_count++;
                    dettaglioRisposte[`domanda_${i}_punti`] = 1;
                    dettaglioRisposte[`domanda_${i}_corretta`] = rispostaCorretta;
                } else {
                    risposteErrate_count++;
                    dettaglioRisposte[`domanda_${i}_punti`] = 0;
                    dettaglioRisposte[`domanda_${i}_corretta`] = rispostaCorretta;
                }
            }
            
            studentData.punteggio = risposteCorrette_count;
            studentData.percentuale = (risposteCorrette_count / 60 * 100).toFixed(1);
            studentData.risposteCorrette = risposteCorrette_count;
            studentData.risposteErrate = risposteErrate_count;
            studentData.risposteMancanti = risposteMancanti_count;
            studentData.dettaglioRisposte = dettaglioRisposte;
            
            // Invio dati a Google Sheets
            inviaAGoogleSheets(studentData);
        });
        
        function inviaAGoogleSheets(data) {
            console.log('Dati da inviare a Google Sheets:', data);
            
            // Test connettività prima dell'invio
            console.log('Testing connessione a:', GOOGLE_SCRIPT_URL);
            
            // Mostra messaggio di caricamento
            const submitBtn = document.querySelector('.submit-btn');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const originalText = buttonText.textContent;
            buttonText.textContent = 'Invio in corso...';
            submitBtn.disabled = true;
            loadingSpinner.classList.add('active');
            
            // Prima verifica se lo script è accessibile con GET
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'GET',
                mode: 'cors'
            }).then(response => {
                console.log('Test GET response:', response);
                
                // Ora invia i dati reali con POST
                return fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
            }).then(response => {
                console.log('POST response:', response);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                return response.text();
            }).then(result => {
                console.log('Risultato ricevuto:', result);
                
                alert(`Test completato e salvato con successo!
            
Studente: ${data.nome} ${data.cognome}
Classe: ${data.classe}
Punteggio: ${data.punteggio}/60 (${data.percentuale}%)
Risposte corrette: ${data.risposteCorrette}
Risposte errate: ${data.risposteErrate}
Risposte mancanti: ${data.risposteMancanti}
Data: ${data.dataTest}

I risultati sono stati salvati in Google Sheets e sarà inviata una notifica al docente.`);
                
                // Reset del form
                document.getElementById('testForm').reset();
                
            }).catch(error => {
                console.error('Errore invio:', error);
                
                // Fallback: prova con no-cors mode
                console.log('Tentativo fallback con no-cors mode...');
                
                return fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                }).then(() => {
                    console.log('Fallback no-cors completato');
                    
                    alert(`Test completato (modalità fallback)!
            
Studente: ${data.nome} ${data.cognome}
Classe: ${data.classe}  
Punteggio: ${data.punteggio}/60 (${data.percentuale}%)
Risposte corrette: ${data.risposteCorrette}
Risposte errate: ${data.risposteErrate}
Risposte mancanti: ${data.risposteMancanti}
Data: ${data.dataTest}

NOTA: Invio completato ma non è possibile verificare la risposta del server.
Controlla il foglio Google Sheets per confermare il salvataggio.`);
                    
                    // Reset del form
                    document.getElementById('testForm').reset();
                    
                }).catch(fallbackError => {
                    console.error('Errore anche nel fallback:', fallbackError);
                    
                    alert(`ERRORE CRITICO nell'invio del test!

Errore principale: ${error.message}
Errore fallback: ${fallbackError.message}

DATI DEL TEST (da salvare manualmente):
Studente: ${data.nome} ${data.cognome}
Classe: ${data.classe}  
Punteggio: ${data.punteggio}/60 (${data.percentuale}%)
Risposte corrette: ${data.risposteCorrette}
Risposte errate: ${data.risposteErrate}
Risposte mancanti: ${data.risposteMancanti}
Data: ${data.dataTest}

URL Google Script: ${GOOGLE_SCRIPT_URL}

Contatta immediatamente l'amministratore del sistema.`);
                });
            }).finally(() => {
                // Ripristina il pulsante
                buttonText.textContent = originalText;
                submitBtn.disabled = false;
                loadingSpinner.classList.remove('active');
            });
        }
    </script>
